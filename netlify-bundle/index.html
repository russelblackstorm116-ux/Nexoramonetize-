<body>
  <iframe id="nexora-frame" src="https://nexora-monetize-336580506297.europe-west2.run.app/" allow="geolocation; microphone; camera; clipboard-write"></iframe>

  <script>
    // Transmettre dynamiquement le chemin et les paramètres de recherche d'URL à l'iframe
    (function() {
      try {
        const baseUrl = "https://nexora-monetize-336580506297.europe-west2.run.app";
        const currentPath = window.location.pathname;
        const currentSearch = window.location.search;
        
        let targetPath = currentPath;
        if (targetPath.endsWith('index.html')) {
          targetPath = '/';
        }
        
        const iframeUrl = baseUrl + (targetPath === '/' ? '' : targetPath) + currentSearch;
        document.getElementById('nexora-frame').src = iframeUrl;
      } catch (e) {
        console.warn("Erreur d'initialisation de l'iframe URL:", e);
      }
    })();
  </script>
